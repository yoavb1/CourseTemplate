{% extends 'base.html' %}

{% block title %}Contact & Support | HCI Store{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm">
            <h3 class="fw-bold mb-3">Contact Support / Newsletter</h3>

            {% if success %}
                <div class="alert alert-success">Thank you! Your message has been sent successfully.</div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Message</label>
                    <textarea name="message" class="form-control" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100" data-track-id="submit_contact_btn">
                    Submit
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
