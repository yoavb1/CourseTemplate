{% extends 'base.html' %}

{% block title %}אפליקציה | HCI Project{% endblock %}

{% block content %}
<h2 class="mb-4">📱 עמוד האפליקציה / קטלוג</h2>

<div class="row">
    {% for item in items %}
    <div class="col-md-4 mb-3">
        <div class="card shadow-sm h-100">
            <div class="card-body">
                <h5 class="card-title">{{ item.title }}</h5>
                <p class="card-text">{{ item.desc }}</p>
                <button class="btn btn-outline-primary w-100" data-track-id="item_click_{{ item.id }}">
                    בחר פריט
                </button>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
